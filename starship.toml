"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$line_break$character\
"""

right_format = """
$c\
$cpp\
$rust\
$golang\
$nodejs\
$java\
$kotlin\
$haskell\
$python\
$lua\
$git_branch\
$git_status\ 
$time\
"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#d9d9d9"
subtext1 = "#d0d0d0"
subtext0 = "#bbbbbb"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#000000"
mantle = "#181825"
crust = "#11111b"


# Username Module
[username]
show_always = true
style_user = "fg:lavender bold italic"
style_root = "fg:maroon bold italic"
format = '[$user ]($style)'

# Directory Module
[directory]
home_symbol = "~"
truncation_length = 2
truncation_symbol = "~/..."
use_os_path_sep = true
style = "bold italic fg:subtext0"
format = '[$path]($style)'
repo_root_style = 'bold italic fg:subtext1'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style) [󱡝](bold italic fg:overlay0)'


# Git Branch Module
[git_branch]
symbol = ""
style = "fg:teal"
format = '[[ $symbol $branch ](fg:green)]($style)'

# Git Status Module
[git_status]
style = "fg:teal"
format = '[[($all_status$ahead_behind )](fg:green)]($style)'

# Node.js Module
[nodejs]
symbol = ""
style = "fg:green"
format = " [$symbol Node ]($style)"

# C Module
[c]
symbol = " "
style = "fg:teal"
format = '[[ $symbol C ](fg:teal)]($style)'

[cpp]
symbol = " "
style = "fg:mauve"
disabled = false
detect_files = ['.clangd', '.clang-format']
format = '[ $symbol Cpp ]($style)'

# Rust Module
[rust]
symbol = ""
style = "fg:peach"
format = " [ $symbol Rust ]($style)"

# Go Module
[golang]
symbol = ""
style = "fg:teal"
format = '[ $symbol Golang ]($style)'

# PHP Module
[php]
symbol = ""
style = "fg:teal"
format = '[[ $symbol Php ](fg:teal)]($style)'

# Java Module
[java]
symbol = " "
style = "fg:teal"
format = '[[ $symbol Java ](fg:teal)]($style)'

# Kotlin Module
[kotlin]
symbol = ""
style = "fg:teal"
format = '[[ $symbol Kotlin ](fg:teal)]($style)'

# Haskell Module
[haskell]
symbol = ""
style = "fg:teal"
format = '[[ $symbol Haskell ](fg:teal)]($style)'

# Python Module
[python]
symbol = ""
style = "fg:teal"
format = '[[ $symbol Python ](fg:#F9E2AF)]($style)'

# Lua Module
[lua]
symbol = "󰢱"
style = "fg:teal"
format = '[[ $symbol Lua ](fg:teal)]($style)'

# Docker Context Module
[docker_context]
symbol = ""
style = "fg:mantle"
format = '[[ $symbol( $context) ](fg:color_bg3)]($style)'

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R "
utc_time_offset = "local"
style = "italic fg:overlay2"

# Line Break Module
[line_break]
disabled = false

# Character Module
[character]
format = """
$symbol 
"""
success_symbol = '[](lavendar bold italic)'
error_symbol = '[](red bold italic)'
