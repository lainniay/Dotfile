allow-lan: false
external-controller: 127.0.0.1:9090
find-process-mode: strict
interface-name: en0
ipv6: false
log-level: info
mode: rule
port: 7890
profile:
    store-selected: true
socks-port: 7891
tcp-concurrent: true
unified-delay: true
