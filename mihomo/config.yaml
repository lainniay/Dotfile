proxy-providers:
    MctlNodes:
        type: file
        path: ./providers/nodes.yaml
        health-check:
            enable: true
            interval: 300
            url: https://www.gstatic.com/generate_204
proxy-groups:
    - name: NodeSelection
      type: select
      use:
        - MctlNodes
    - name: OpenAI
      type: select
      use:
        - MctlNodes
      filter: (?i)^(Japan|United States)
