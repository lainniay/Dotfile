---
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  use-system-hosts: true
  respect-rules: false

  # 仅供 Mihomo 内部解析使用，不监听 DNS 端口或接管系统 DNS。
  # 使用 IP 形式的 DoH 引导解析，避免依赖明文 DNS。
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

  # 默认查询明确走渲染后配置中的 Pro 策略组。
  nameserver:
    - "https://1.1.1.1/dns-query#Pro"
    - "https://8.8.8.8/dns-query#Pro"

  # 节点域名独立直连解析，避免 DNS 与代理连接循环依赖。
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://223.6.6.6/dns-query#DIRECT"

  # DIRECT 连接使用国内 DoH，同时保留下面的内网域名策略。
  direct-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://223.6.6.6/dns-query#DIRECT"
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "+.ts.net": system
